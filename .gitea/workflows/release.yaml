---
name: goreleaser

"on":
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-22.04-htzhel1-ax42-a
    steps:
      - name: Checkout
        uses: https://gitea.obmondo.com/Obmondo/checkout@v4.3.0
        with:
          # This is required for the changelog to work correctly.
          fetch-depth: 0
      - name: Set up Go
        uses: https://gitea.obmondo.com/Obmondo/setup-go@v6.0.0
        with:
          go-version: "1.24"

      - name: Run GoReleaser
        uses: https://gitea.obmondo.com/Obmondo/goreleaser-action@v6.4.0
        with:
          version: "v2.12.7"
          args: release --clean --config .goreleaser-gitea.yaml --release-notes=.release-notes.md
        env:
          GITEA_TOKEN: ${{ secrets.GORELEASER_TOKEN }}

  publish-charts:
    runs-on: ubuntu-22.04-htzhel1-ax42-a
    container:
      image: ghcr.io/obmondo/kubeaid/helm-chart-update:1.0.0
    steps:
      - name: Checkout
        uses: https://gitea.obmondo.com/Obmondo/checkout@v4.3.0

      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "$HARBOR_PASSWORD" \
            | helm registry login harbor.obmondo.com -u "$HARBOR_USERNAME" --password-stdin

      - name: Publish charts listed in .helm-charts-publish
        env:
          HELM_OCI_REGISTRY: oci://harbor.obmondo.com/obmondo/charts
        run: ./bin/publish-helm-chart.sh
