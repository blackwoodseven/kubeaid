<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fd0"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7a52c7"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8b57"/></marker>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b80"/></marker>
  </defs>

  <rect width="1240" height="710" fill="#ffffff"/>

  <text x="620" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2d3d">The VPN cluster after the move: 3 × cax21 with a Floating IP for STUN/TURN</text>

  <rect x="20" y="56" width="1200" height="600" rx="12" fill="#f6f8fb" stroke="#c9d3e0"/>

  <rect x="60" y="76" width="1120" height="40" rx="8" fill="#eef2f7" stroke="#8a99ad"/>
  <text x="620" y="101" text-anchor="middle" font-size="14" fill="#1f2d3d">Internet — NetBird apps, browsers, admins</text>

  <line x1="210" y1="116" x2="210" y2="146" stroke="#2f6fd0" stroke-width="2" marker-end="url(#a-blue)"/>
  <text x="620" y="138" text-anchor="middle" font-size="11" fill="#7a52c7">(no public access)</text>
  <line x1="1010" y1="116" x2="1010" y2="146" stroke="#d9822b" stroke-width="2" marker-end="url(#a-orange)"/>

  <rect x="100" y="150" width="220" height="70" rx="8" fill="#e3efff" stroke="#2f6fd0"/>
  <text x="210" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">Traefik load balancer</text>
  <text x="210" y="191" text-anchor="middle" font-size="12" fill="#1f2d3d">public IP</text>
  <text x="210" y="209" text-anchor="middle" font-size="12" fill="#5b6b80">web, Keycloak, relay</text>

  <rect x="510" y="150" width="220" height="70" rx="8" fill="#efe8fb" stroke="#7a52c7"/>
  <text x="620" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">API load balancer</text>
  <text x="620" y="191" text-anchor="middle" font-size="12" fill="#1f2d3d">10.0.0.3, private only</text>
  <text x="620" y="209" text-anchor="middle" font-size="12" fill="#5b6b80">public side off</text>

  <rect x="900" y="150" width="220" height="70" rx="8" fill="#fff1e0" stroke="#d9822b"/>
  <text x="1010" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2d3d">Floating IP (Coturn)</text>
  <text x="1010" y="191" text-anchor="middle" font-size="12" fill="#1f2d3d">stun / turn DNS → here</text>
  <text x="1010" y="209" text-anchor="middle" font-size="12" fill="#5b6b80">moved by hcloud-fip-controller</text>

  <line x1="1010" y1="220" x2="1010" y2="240" stroke="#d9822b" stroke-width="2" marker-end="url(#a-orange)"/>
  <rect x="900" y="244" width="220" height="46" rx="8" fill="#fdecec" stroke="#d0342c" stroke-dasharray="5 3"/>
  <text x="1010" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="#d0342c">Firewall</text>
  <text x="1010" y="281" text-anchor="middle" font-size="12" fill="#1f2d3d">only 3478, 5349, 49152–65535</text>

  <line x1="210" y1="220" x2="210" y2="330" stroke="#2f6fd0" stroke-width="2"/>
  <line x1="620" y1="220" x2="620" y2="330" stroke="#7a52c7" stroke-width="2"/>
  <line x1="200" y1="330" x2="790" y2="330" stroke="#5b6b80" stroke-width="2"/>
  <line x1="215" y1="330" x2="215" y2="346" stroke="#5b6b80" stroke-width="2" marker-end="url(#a-gray)"/>
  <line x1="495" y1="330" x2="495" y2="346" stroke="#5b6b80" stroke-width="2" marker-end="url(#a-gray)"/>
  <line x1="775" y1="330" x2="775" y2="346" stroke="#5b6b80" stroke-width="2" marker-end="url(#a-gray)"/>
  <path d="M1010,290 V318 H860 V346" fill="none" stroke="#d9822b" stroke-width="2" marker-end="url(#a-orange)"/>

  <rect x="60" y="306" width="1120" height="254" rx="10" fill="none" stroke="#8a99ad" stroke-dasharray="6 4"/>
  <text x="72" y="552" font-size="12" fill="#5b6b80">Hetzner private network 10.0.0.0/16</text>

  <rect x="100" y="350" width="230" height="150" rx="8" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
  <text x="114" y="372" font-size="14" font-weight="bold" fill="#1f2d3d">node 1</text>
  <text x="114" y="392" font-size="12" fill="#5b6b80">cax21 · arm64</text>
  <text x="114" y="411" font-size="12" fill="#1f2d3d">private 10.0.0.x</text>
  <text x="114" y="430" font-size="12" fill="#1f2d3d">own public IPv4</text>
  <text x="114" y="452" font-size="12" fill="#1f2d3d">Coturn on the host network</text>

  <rect x="380" y="350" width="230" height="150" rx="8" fill="#ffffff" stroke="#34495e" stroke-width="1.5"/>
  <text x="394" y="372" font-size="14" font-weight="bold" fill="#1f2d3d">node 2</text>
  <text x="394" y="392" font-size="12" fill="#5b6b80">cax21 · arm64</text>
  <text x="394" y="411" font-size="12" fill="#1f2d3d">private 10.0.0.x</text>
  <text x="394" y="430" font-size="12" fill="#1f2d3d">own public IPv4</text>
  <text x="394" y="452" font-size="12" fill="#1f2d3d">Coturn on the host network</text>

  <rect x="660" y="350" width="230" height="150" rx="8" fill="#ffffff" stroke="#d9822b" stroke-width="2"/>
  <text x="674" y="372" font-size="14" font-weight="bold" fill="#1f2d3d">node 3</text>
  <text x="674" y="392" font-size="12" fill="#5b6b80">cax21 · arm64</text>
  <text x="674" y="411" font-size="12" fill="#1f2d3d">private 10.0.0.x</text>
  <text x="674" y="430" font-size="12" fill="#1f2d3d">own public IPv4</text>
  <text x="674" y="452" font-size="12" fill="#1f2d3d">Coturn on the host network</text>
  <text x="674" y="480" font-size="12" font-weight="bold" fill="#d9822b">holds the Floating IP</text>

  <path d="M775,500 V522 H215 V504" fill="none" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-orange)"/>
  <path d="M495,522 V504" fill="none" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-orange)"/>
  <text x="495" y="542" text-anchor="middle" font-size="11" fill="#d9822b">the Floating IP moves to a healthy node if its node fails</text>

  <text x="60" y="622" font-size="12" fill="#5b6b80">kubectl comes in over the NetBird mesh (netbird-kubeapi-proxy), as today.</text>

  <line x1="351" y1="684" x2="381" y2="684" stroke="#2f6fd0" stroke-width="3"/>
  <text x="387" y="688" font-size="12" fill="#1f2d3d">web &amp; relay</text>
  <line x1="490" y1="684" x2="520" y2="684" stroke="#7a52c7" stroke-width="3"/>
  <text x="526" y="688" font-size="12" fill="#1f2d3d">API</text>
  <line x1="576" y1="684" x2="606" y2="684" stroke="#d9822b" stroke-width="3"/>
  <text x="612" y="688" font-size="12" fill="#1f2d3d">STUN / TURN</text>
  <line x1="717" y1="684" x2="747" y2="684" stroke="#5b6b80" stroke-width="3"/>
  <text x="753" y="688" font-size="12" fill="#1f2d3d">load balancers → nodes</text>
</svg>
