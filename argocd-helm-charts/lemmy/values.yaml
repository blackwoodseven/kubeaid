global:
  postgresql:
    enabled: true
    instanceName: lemmy
    instances: 1
    size: 10Gi
    database: lemmy
    owner: lemmy
    monitoring:
      enablePodMonitor: true
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
        cpu: 100m
    backups:
      enabled: false
    logicalbackup:
      enabled: false

# Configuration for the upstream 'lemmy' chart dependency
lemmy:
  serverName: "localhost"

  admin:
    username: lemmy
    email: lemmy@example.com
    # generated on first install or set via existingSecret name in production

  ingress:
    enabled: false

  postgresql:
    enabled: false  # Disable bundled postgres
    host: lemmy-pgsql-rw
    auth:
      username: lemmy
      database: lemmy
      # password comes from the CNPG app secret
      existingSecret: lemmy-pgsql-app
      secretKeys:
        userPasswordKey: password

  backend:
    env:
      # $(PGPASSWORD) is expanded by kubernetes, overrides config.hjson
      LEMMY_DATABASE_URL: "postgresql://lemmy:$(PGPASSWORD)@lemmy-pgsql-rw:5432/lemmy?sslmode=prefer"

  federationsender:
    env:
      LEMMY_DATABASE_URL: "postgresql://lemmy:$(PGPASSWORD)@lemmy-pgsql-rw:5432/lemmy?sslmode=prefer"

  taskrunner:
    env:
      LEMMY_DATABASE_URL: "postgresql://lemmy:$(PGPASSWORD)@lemmy-pgsql-rw:5432/lemmy?sslmode=prefer"

  pictrs:
    persistence:
      enabled: true
      size: 10Gi
      accessMode: ReadWriteOnce
    storage:
      method: filesystem
