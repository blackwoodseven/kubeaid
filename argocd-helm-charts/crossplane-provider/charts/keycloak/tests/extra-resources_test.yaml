suite: extraResources pass-through
templates:
  - extra-resources.yaml
release:
  name: crossplane-provider
  namespace: crossplane
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders raw resources verbatim with the wave-2 annotations added
    set:
      extraResources:
        - apiVersion: example.m.upbound.io/v1alpha1
          kind: Thing
          metadata:
            name: raw
            namespace: crossplane
          spec:
            forProvider:
              size: 3
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Thing
      - equal:
          path: metadata.name
          value: raw
      - equal:
          path: spec.forProvider.size
          value: 3
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "2"
            argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

  - it: lets the resource keep its own annotations and override the wave
    set:
      extraResources:
        - apiVersion: example.m.upbound.io/v1alpha1
          kind: Thing
          metadata:
            name: early
            annotations:
              argocd.argoproj.io/sync-wave: "1"
              crossplane.io/external-name: existing
    asserts:
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "1"
            argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
            crossplane.io/external-name: existing
