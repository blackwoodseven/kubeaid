apiVersion: v2
name: pixelfed
version: 1.0.0
description: A Helm chart for deploying Pixelfed - a federated social media app focused on photos
# charts/pixelfed is a locally patched copy of upstream v0.23.0
# (https://github.com/small-hack/pixelfed-chart), carrying two fixes to
# templates/configmap_env.yaml:
#   1. contact_email used .Values inside a `with` block; now an `if`.
#   2. REDIS_HOST was set from externalValkey.port; now from .host.
# It is declared below with an empty repository, which is how Helm is told a
# subchart already lives in charts/: `helm dependency update` then leaves it
# alone ("did not declare a repository. Assuming it exists in the charts
# directory") instead of refetching upstream over the patches. Leaving it
# undeclared instead makes `helm lint` fail on missing dependency metadata.
dependencies:
  - name: kubeaid-addons
    version: 0.1.0
    repository: file://../kubeaid-addons
  - name: pixelfed
    version: 0.23.0
    repository: ""
