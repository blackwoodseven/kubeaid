act-runner:
  replicaCount: 1
  # The runner PVC is ReadWriteOnce: a rolling update deadlocks on Multi-Attach
  # when the new pod lands on another node, so stop the old pod first.
  strategy:
    type: Recreate
  podSecurityContext:
    fsGroup: 1000
    # Skip the recursive chown of the whole PVC on every start (minutes on a big volume).
    fsGroupChangePolicy: OnRootMismatch
  securityContext:
    privileged: true
    runAsUser: 1000
    runAsGroup: 1000
  image:
    repository: vegardit/gitea-act-runner
    tag: dind-1.0.6
    pullPolicy: Always
  act_runner:
    parallel_jobs: 2
    storage:
      size: 20Gi
    registrySecretName: ""
    registrySecretMountPath: "/runner/.docker"
runner:
  nameSpace:
    create: false
  serviceAccount:
    create: false
