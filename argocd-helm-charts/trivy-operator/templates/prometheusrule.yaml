{{- if .Values.kubeaid.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "trivy-operator-wrapper.fullname" . }}-cve-alerts
  labels:
    {{- include "trivy-operator-wrapper.labels" . | nindent 4 }}
    {{- with .Values.kubeaid.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.kubeaid.prometheusRule.additionalAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    # Two questions only: is the scanner working, is the backlog out of hand.
    # Correlating CVEs against newer tags is deliberately NOT done here —
    # rebuilding image references with label_replace failed silently twice.
    - name: trivy-operator.health
      rules:
        # A scanner producing nothing looks exactly like a clean cluster.
        - alert: TrivyOperatorMetricsMissing
          expr: |
            absent(trivy_image_vulnerabilities)
          for: {{ .Values.kubeaid.prometheusRule.blindFor }}
          labels:
            severity: critical
          annotations:
            summary: "Trivy Operator is reporting no vulnerability metrics"
            description: "trivy_image_vulnerabilities is absent. Either the operator is down, its ServiceMonitor is not being scraped, or every VulnerabilityReport expired past scannerReportTTL without being refreshed. While this is true the cluster is UNSCANNED, not clean."

    - name: trivy-operator.backlog
      rules:
        # warning, not critical: this count is never zero on a real cluster,
        # and a muted receiver would take the alert above down with it.
        #
        # "fixable" comes from trivy.ignoreUnfixed, not from this expression —
        # the metric has no fixed_version label. Wording follows the value.
        #
        # Counted once per image: Trivy writes a report per workload container,
        # so a plain sum counts an image once for every workload running it.
        # Critical only: High runs at about ten times the volume and would set
        # the threshold on its own.
        {{- $fixableOnly := index .Values "trivy-operator" "trivy" "ignoreUnfixed" }}
        {{- $excluded := .Values.kubeaid.prometheusRule.backlogExcludeNamespaces }}
        - alert: ClusterVulnerabilityBacklog
          expr: |
            sum(max by (image_registry, image_repository, image_tag) (
              trivy_image_vulnerabilities{severity="Critical"{{ with $excluded }}, namespace!~"{{ . }}"{{ end }}}
            )) > {{ .Values.kubeaid.prometheusRule.backlogThreshold }}
          for: {{ .Values.kubeaid.prometheusRule.backlogFor }}
          labels:
            severity: warning
          annotations:
            summary: "Cluster has {{ "{{ $value }}" }} {{ if $fixableOnly }}fixable {{ end }}Critical CVEs across its images"
            description: "Critical findings, counted once per image{{ with $excluded }} outside namespaces matching {{ . }}{{ end }}, exceed the threshold of {{ .Values.kubeaid.prometheusRule.backlogThreshold }}. {{ if $fixableOnly }}Every finding counted has a published fix, so the backlog is actionable.{{ else }}This count includes CVEs with no published fix, because trivy.ignoreUnfixed is false — some of it may not be actionable.{{ end }} Per-image detail: kubectl get vulnerabilityreports -A."
{{- end }}
