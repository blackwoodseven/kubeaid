trivy-operator:
  # Scan every namespace except platform/system ones; tune per cluster.
  excludeNamespaces: ""
  targetNamespaces: ""

  # Enable Prometheus integration. The chart ships its own ServiceMonitor.
  serviceMonitor:
    enabled: true
    interval: 60s
    labels: {}

  # Surface per-CVE metrics so Alertmanager rules can target specific CVE IDs.
  operator:
    metricsContainerEnabled: true
    metricsVulnIdEnabled: true
    metricsExposedSecretInfo: true
    metricsConfigAuditInfo: true
    builtInTrivyServer: true
    scannerReportTTL: "24h"
    # SBOMReports are the single largest thing this operator writes to etcd —
    # one per container image, tens to hundreds of KB each, and they are
    # regenerated on every scan cycle. On a cluster with ~900 images that is
    # ~95MB of JSON living in etcd permanently, which shows up as multi-second
    # LIST/count latency across *every* resource type and, downstream, as
    # apiserver handler timeouts.
    #
    # Nothing in this chart reads them: the alerts below key off
    # trivy_image_vulnerabilities, which comes from VulnerabilityReport.
    # Turn this back on only if you actually consume ClusterVulnerabilityReports,
    # and budget the etcd space before you do.
    sbomGenerationEnabled: false

  trivy:
    # Skip CVEs with no fix available — cuts a lot of noise on base images.
    ignoreUnfixed: true
    # Limit severities reported to keep storage/Prometheus cardinality manageable.
    severity: "CRITICAL,HIGH"
    # Use the operator-managed Trivy server pod (instead of one Trivy job per scan).
    storageClassEnabled: false

  # Resource limits for the operator + scanner pods.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# KubeAid-side toggles for Prometheus alert rules generated by templates/.
kubeaid:
  prometheusRule:
    enabled: true

    # -- How long the scanner must report nothing before TrivyOperatorMetricsMissing
    # fires. Rides out a restart or a missed scrape.
    blindFor: "1h"

    # -- Critical findings in one image at or above which the image is behind.
    # ClusterVulnerabilityBacklog fires, once per cluster, while any image is,
    # and lists them. Whether these are all fixable follows trivy.ignoreUnfixed.
    imageCriticalThreshold: 10
    # -- How long an image must stay behind before the alert fires. Keep it
    # longer than scannerReportTTL: after a rollout the superseded ReplicaSet
    # keeps its report, and its older image's CVEs, until the TTL removes it.
    backlogFor: "48h"
    # -- Regex of namespaces left out, e.g. "dev-.*" for developer environments.
    # Empty counts every scanned namespace. No quotes or backslashes: it ends up
    # inside PromQL and inside the alert text.
    backlogExcludeNamespaces: ""

    additionalLabels: {}
    additionalAnnotations: {}
