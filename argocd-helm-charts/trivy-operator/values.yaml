trivy-operator:
  # Scan every namespace except platform/system ones; tune per cluster.
  excludeNamespaces: ""
  targetNamespaces: ""

  # Enable Prometheus integration. The chart ships its own ServiceMonitor.
  serviceMonitor:
    enabled: true
    interval: 60s
    labels: {}

  # Surface per-CVE metrics so Alertmanager rules can target specific CVE IDs.
  operator:
    metricsContainerEnabled: true
    metricsVulnIdEnabled: true
    metricsExposedSecretInfo: true
    metricsConfigAuditInfo: true
    builtInTrivyServer: true
    scannerReportTTL: "24h"

  trivy:
    # Skip CVEs with no fix available — cuts a lot of noise on base images.
    ignoreUnfixed: true
    # Limit severities reported to keep storage/Prometheus cardinality manageable.
    severity: "CRITICAL,HIGH"
    # Use the operator-managed Trivy server pod (instead of one Trivy job per scan).
    storageClassEnabled: false

  # Resource limits for the operator + scanner pods.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# KubeAid-side toggles for Prometheus alert rules generated by templates/.
kubeaid:
  prometheusRule:
    enabled: true

    # TrivyOperatorMetricsMissing — the scanner is producing nothing, so the
    # cluster is unscanned rather than clean. Severity critical. Long enough to
    # ride out an operator restart or a missed scrape, short enough that a
    # genuinely dead scanner does not go unnoticed for a working day.
    blindFor: "1h"

    # ClusterVulnerabilityBacklog — Critical/High findings above this count.
    # Severity warning: with ignoreUnfixed the count is still never zero on a
    # real cluster, so marking it critical would get the receiver muted.
    #
    # Whether these are all fixable depends on trivy.ignoreUnfixed above, not
    # on the alert — the metric it counts carries no fixed_version label.
    #
    # Tune per cluster. The default is deliberately high: an alert that fires
    # on day one everywhere teaches operators to ignore it.
    backlogThreshold: 100
    backlogFor: "24h"

    additionalLabels: {}
    additionalAnnotations: {}
