global:
  postgresql:
    enabled: true
    instanceName: funkwhale
    instances: 1
    size: 5Gi
    database: funkwhale
    owner: funkwhale
    monitoring:
      enablePodMonitor: true
    resources:
      limits:
        memory: 512Mi
      requests:
        memory: 256Mi
        cpu: 100m
    backups:
      enabled: false
    logicalbackup:
      enabled: false

# Redis configuration for wrapper templates
externalRedis:
  enabled: true
  mode: standalone
  replicas: 1
  name: funkwhale-redis
  storage: 2Gi
  image: quay.io/opstree/redis:v7.2.6
  imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

# Funkwhale chart configuration
funkwhale:
  # Domain configuration
  ingress:
    enabled: true
    protocol: https
    host: funkwhale.example.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/proxy-body-size: 500m
    tls:
      - secretName: funkwhale-tls
        hosts:
          - funkwhale.example.com

  # Django secret key (auto-generated if not set)
  # set DJANGO_SECRET_KEY via extraEnvVars from a sealed secret to keep it stable across syncs
  djangoSecret: ""

  # Disable bundled PostgreSQL - we use CloudNative-PG operator
  postgresql:
    enabled: false
    host: funkwhale-pgsql-rw
    # full connection uri from the CNPG app secret
    existingSecret: funkwhale-pgsql-app
    existingSecretKey: uri

  # Disable bundled Redis - we use Redis Operator
  redis:
    enabled: false
    host: funkwhale-redis
    auth:
      enabled: false  # Redis operator standalone doesn't use password by default

  # Persistence configuration
  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 10Gi
    # storageClass: ""

  # S3/MinIO configuration for media storage (optional)
  s3:
    enabled: false

  # API server configuration
  api:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  # Frontend/proxy configuration
  front:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi

  # Celery configuration
  celery:
    beat:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

    worker:
      replicaCount: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi

  # Additional environment variables
  extraEnv: {}
  # LDAP_ENABLED: "True"

  # Additional secret environment variables
  extraSecret: {}
  # EMAIL_CONFIG: smtp://
  # DEFAULT_FROM_EMAIL: funkwhale@example.com
