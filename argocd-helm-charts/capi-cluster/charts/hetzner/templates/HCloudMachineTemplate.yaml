{{/* Handling control-plane in HCloud. */}}
{{- if or (eq .Values.mode "hcloud") (eq .Values.mode "hybrid") }}
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: {{ .Values.global.clusterName }}-control-plane
spec:
  template:
    metadata:
      labels:
        node.cluster.x-k8s.io/cloud-provider: hcloud
    spec:
      imageName: {{ .Values.hcloud.imageName }}
      placementGroupName: control-plane
      type: {{ .Values.controlPlane.hcloud.machineType }}
      publicNetwork:
        {{/* Nodes have no public IPv4/IPv6 when using a private network (hcloud
             with network.type=private) or when running in hybrid mode.
             controlPlane.hcloud.publicNetwork.enabled still gives control-plane
             nodes a public IPv4 and IPv6, keeping the private network, e.g. so a
             Floating IP (controlPlane.hcloud.floatingIPs) can be assigned to
             them: Hetzner only assigns Floating IPs to servers that have a
             Primary IP of the same family. IPv6 needs no counterpart to the IPv4
             source-based policy routing in KubeadmControlPlane.yaml, because the
             private network is IPv4-only, so the public interface already
             carries the node's only IPv6 default route. */}}
        {{- $isPrivate := or (eq .Values.mode "hybrid") (eq .Values.network.type "private") }}
        {{- $cpPublic := dig "publicNetwork" "enabled" false (.Values.controlPlane.hcloud | default dict) }}
        enableIPv4: {{ or (not $isPrivate) $cpPublic }}
        enableIPv6: {{ or (not $isPrivate) $cpPublic }}
{{- end }}

{{/* Handling node-groups in HCloud. */}}
{{- if or (eq .Values.mode "hcloud") (eq .Values.mode "hybrid") }}
{{- range $nodeGroupIndex, $nodeGroup := $.Values.nodeGroups.hcloud }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: {{ printf "%s-%s" $.Values.global.clusterName $nodeGroup.name }}
spec:
  template:
    metadata:
      labels:
        node.cluster.x-k8s.io/cloud-provider: hcloud
    spec:
      imageName: {{ $.Values.hcloud.imageName }}
      placementGroupName: {{ $nodeGroup.name }}
      type: {{ $nodeGroup.machineType }}
      publicNetwork:
        {{/* Nodes have no public IPv4/IPv6 when using a private network (hcloud
             with network.type=private) or when running in hybrid mode. */}}
        {{- $isPrivate := or (eq $.Values.mode "hybrid") (eq $.Values.network.type "private") }}
        enableIPv4: {{ not $isPrivate }}
        enableIPv6: {{ not $isPrivate }}
{{- end }}
{{- end }}
