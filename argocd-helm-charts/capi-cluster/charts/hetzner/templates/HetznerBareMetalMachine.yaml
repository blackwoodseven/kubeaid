{{- if or (eq .Values.mode "bare-metal") (eq .Values.mode "hybrid") }}
{{- range $nodeGroupIndex, $nodeGroup := $.Values.nodeGroups.bareMetal }}
{{- range $hostIndex, $host := $nodeGroup.bareMetalHosts }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerBareMetalMachine
metadata:
  name: {{ printf "%s-%s-%s" $.Values.global.clusterName $nodeGroup.name $host.serverID }}
spec:
  hostSelector:
    matchLabels:
      role: {{ printf "%s-%s" $.Values.global.clusterName $nodeGroup.name }}
      host: {{ $host.serverID | quote }}
  installImage:
    image:
      path: {{ $.Values.bareMetal.installImage.imagePath }}
    partitions:
      {{- if eq (default "efi" $.Values.bareMetal.installImage.firmware) "efi" }}
      - fileSystem: esp
        mount: /boot/efi
        size: 512M
      {{- end }}
      - fileSystem: ext4
        mount: /boot
        size: 1024M
      # Logical Volume Group.
      - fileSystem: vg0
        mount: lvm
        size: {{ $.Values.bareMetal.installImage.vg0.size }}G
    logicalVolumeDefinitions:
      # The Operating System (OS).
      - vg: vg0
        name: root
        mount: /
        filesystem: ext4
        size: {{ $.Values.bareMetal.installImage.vg0.rootVolumeSize }}G
    postInstallScript: |
      #!/bin/bash

      {{- include "hetzner.efiBootOrderScript" . | nindent 6 }}

      mkdir -p /etc/cloud/cloud.cfg.d && touch /etc/cloud/cloud.cfg.d/99-custom-networking.cfg
      echo "network: { config: disabled }" > /etc/cloud/cloud.cfg.d/99-custom-networking.cfg

      apt-get update && apt-get install -y cloud-init apparmor apparmor-utils

      {{/*
        Dracut is a set of tools that provide enhanced functionality for automating the Linux boot
        process. The tool named dracut is used to create a Linux boot image (initramfs) by copying
        tools and files from an installed system and combining it with the Dracut framework.

        You can read more about initramfs here : https://en.wikipedia.org/wiki/Initial_ramdisk.

        The initramfs has essentially one purpose: locating and mounting the real root file system
        so that the boot process can transition to it. This functionality is dependent on device
        availability. Therefore, instead of having hard-coded scripts to determine device
        availability and suitability, Dracut's initramfs depends on the Linux device manager (udev)
        to create symbolic links to device nodes. When the root file system's device node appears,
        Dracut mounts it as the new root file system.

        The issue :

          The OS is built on some machine owned by Hetzner. And the initramfs packaged with the OS
          refers to UUIDs of partitions in that machine.

          Now, in our machine, when we're in rescue mode, we create the necessary partitions,
          followerd by installing the OS. And then we try to boot into that OS. As mentioned above,
          the initramfs is loaded at first, which then is supposed to load the permanent root file
          system.

          But, the initramfs remains stuck, since it can't find any partition with the given UUIDs.

        The fix :

          after installing the OS, we use dracut to regenerate the initramfs, so it refers to UUIDs
          of partitions in our machine.
      */}}
      dracut --force --regenerate-all

      cloud-init clean --logs
    swraid: 1
    swraidLevel: {{ ($nodeGroup.raid).level | default 1 }}
  sshSpec:
    portAfterCloudInit: 22
    portAfterInstallImage: 22
    secretRef:
      key:
        name: sshkey-name
        privateKey: ssh-privatekey
        publicKey: ssh-publickey
      name: {{ $.Values.sshKeyPair.secretName }}
{{- end }}
{{- end }}
{{- end }}
