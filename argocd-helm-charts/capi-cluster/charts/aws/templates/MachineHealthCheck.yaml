{{- /* Watches control-plane Machines — EKS clusters have none (AWS owns the
     control plane), so this renders only for the kubeadm variant. */}}
{{- if not .Values.eks }}
apiVersion: cluster.x-k8s.io/v1beta2
kind: MachineHealthCheck
metadata:
  name: {{ .Values.global.clusterName }}-kcp-unhealthy
spec:
  clusterName: {{ .Values.global.clusterName }}
  maxUnhealthy: 100%
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: {{ .Values.global.clusterName }}
      cluster.x-k8s.io/control-plane: ""
  unhealthyConditions:
    - type: Ready
      status: Unknown
      timeout: 5m0s
    - type: Ready
      status: "False"
      timeout: 5m0s
{{- end }}
