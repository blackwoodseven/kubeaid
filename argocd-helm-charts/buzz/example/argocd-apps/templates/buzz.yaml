apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: buzz
  namespace: argocd
spec:
  destination:
    namespace: buzz
    server: https://kubernetes.default.svc
  project: default
  sources:
    - repoURL: https://github.com/Organization/KubeAid.git
      path: argocd-helm-charts/buzz
      targetRevision: HEAD
      helm:
        valueFiles:
          - path/values-buzz.yaml
    - repoURL: https://github.com/Organization/kubeaid-config.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true
