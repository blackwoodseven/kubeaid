{{- if and .Values.syncSecrets (default false .Values.syncSecrets.enabled) }}
---
# The background controller runs the GeneratingPolicies: it reads the source
# Secret (resource.Get) and creates, updates and deletes the copies. Kyverno's
# default role has no Secret permissions, so grant them via the aggregation
# label the chart's background-controller ClusterRole selects on.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:sync-secrets
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
