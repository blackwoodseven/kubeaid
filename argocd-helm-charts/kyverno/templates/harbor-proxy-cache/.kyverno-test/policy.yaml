---
# Source: kyverno/templates/harbor-proxy-cache/harbor-proxy-cache-mutate.yaml
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: harbor-proxy-cache-mutate
  annotations:
    policies.kyverno.io/title: "Redirect public registry images to Harbor proxy cache"
    policies.kyverno.io/category: "Image Registry"
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: "Pod,Deployment,StatefulSet,DaemonSet,Job,CronJob"
    policies.kyverno.io/description: >-
      Rewrites container and initContainer images that point at Docker Hub, ghcr.io or
      registry.k8s.io (each only when a Harbor project is configured for it) to the
      proxy-cache projects on harbor.example.com and adds the matching imagePullSecret,
      so pulls bypass upstream rate limits. Mutates at admission time on CREATE.
    kyverno.io/kubernetes-version: "1.27"
    policies.kyverno.io/minversion: 1.19.0
spec:
  # A failure here must never block a workload from being created.
  failurePolicy: Ignore
  evaluation:
    mutateExisting:
      # Off by default: imagePullSecrets cannot be changed on a running Pod.
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments", "statefulsets", "daemonsets"]
        operations: ["CREATE"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        resources: ["jobs", "cronjobs"]
        operations: ["CREATE"]
  matchConditions:
    - name: not-excluded-namespace
      expression: "!(object.metadata.namespace in ['harbor'])"
    # Skip entirely when no image needs rewriting, so unrelated workloads see no patch.
    - name: needs-rewrite
      expression: "variables.pullSecrets.size() > 0"
  variables:
    # The pod spec sits at a different path per kind. All later variables and
    # patch paths are built from these two, so one policy covers every kind.
    - name: base
      expression: >-
        object.kind == "Pod" ? "/spec"
        : object.kind == "CronJob" ? "/spec/jobTemplate/spec/template/spec"
        : "/spec/template/spec"
    - name: podSpec
      expression: >-
        object.kind == "Pod" ? object.spec
        : object.kind == "CronJob" ? object.spec.jobTemplate.spec.template.spec
        : object.spec.template.spec
    - name: containers
      expression: "variables.podSpec.containers"
    - name: initContainers
      expression: "has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : []"
    - name: images
      expression: "variables.containers.map(c, c.image) + variables.initContainers.map(c, c.image)"
    # Which upstream registries are in use decides which pull secrets to add.
    - name: dockerHubImages
      expression: >-
        variables.images.filter(i, !i.startsWith("harbor.example.com/") && (
          i.startsWith("index.docker.io/") || i.startsWith("registry-1.docker.io/") || i.startsWith("docker.io/")
          || i.matches("^[^/.:]+/.+$") || i.matches("^[^/]+$")))
    - name: ghcrImages
      expression: >-
        variables.images.filter(i, !i.startsWith("harbor.example.com/") && i.startsWith("ghcr.io/"))
    - name: k8sImages
      expression: >-
        variables.images.filter(i, !i.startsWith("harbor.example.com/") && i.startsWith("registry.k8s.io/"))
    - name: pullSecrets
      expression: >-
        (variables.dockerHubImages.size() > 0 ? ["harbor-proxy-cache"] : [])
        + (variables.ghcrImages.size() > 0 ? ["harbor-ghcr-proxy-cache"] : [])
        + (variables.k8sImages.size() > 0 ? ["harbor-registry-k8s-proxy-cache"] : [])
    - name: existingPullSecrets
      expression: "has(variables.podSpec.imagePullSecrets) ? variables.podSpec.imagePullSecrets.map(s, s.name) : []"
  mutations:
    # One JSON patch per container image, plus the pull secrets that are missing.
    # JSONPatch is used instead of ApplyConfiguration because imagePullSecrets is
    # an atomic list in the Pod schema and cannot be appended to declaratively.
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          variables.containers.map(c, JSONPatch{
            op: "replace",
            path: variables.base + "/containers/" + string(variables.containers.indexOf(c)) + "/image",
            value: 
              c.image.startsWith("harbor.example.com/") ? c.image
              : c.image.startsWith("index.docker.io/") ? "harbor.example.com/docker-hub-proxy-cache/" + (c.image.substring(16).contains("/") ? c.image.substring(16) : "library/" + c.image.substring(16))
              : c.image.startsWith("registry-1.docker.io/") ? "harbor.example.com/docker-hub-proxy-cache/" + (c.image.substring(21).contains("/") ? c.image.substring(21) : "library/" + c.image.substring(21))
              : c.image.startsWith("docker.io/") ? "harbor.example.com/docker-hub-proxy-cache/" + (c.image.substring(10).contains("/") ? c.image.substring(10) : "library/" + c.image.substring(10))
              : c.image.startsWith("ghcr.io/") ? "harbor.example.com/ghcr-proxy-cache/" + c.image.substring(8)
              : c.image.startsWith("registry.k8s.io/") ? "harbor.example.com/registry-k8s-proxy-cache/" + c.image.substring(16)
              : c.image.matches("^[^/.:]+/.+$") ? "harbor.example.com/docker-hub-proxy-cache/" + c.image
              : c.image.matches("^[^/]+$") ? "harbor.example.com/docker-hub-proxy-cache/library/" + c.image
              : c.image
          })
          + variables.initContainers.map(c, JSONPatch{
            op: "replace",
            path: variables.base + "/initContainers/" + string(variables.initContainers.indexOf(c)) + "/image",
            value: 
              c.image.startsWith("harbor.example.com/") ? c.image
              : c.image.startsWith("index.docker.io/") ? "harbor.example.com/docker-hub-proxy-cache/" + (c.image.substring(16).contains("/") ? c.image.substring(16) : "library/" + c.image.substring(16))
              : c.image.startsWith("registry-1.docker.io/") ? "harbor.example.com/docker-hub-proxy-cache/" + (c.image.substring(21).contains("/") ? c.image.substring(21) : "library/" + c.image.substring(21))
              : c.image.startsWith("docker.io/") ? "harbor.example.com/docker-hub-proxy-cache/" + (c.image.substring(10).contains("/") ? c.image.substring(10) : "library/" + c.image.substring(10))
              : c.image.startsWith("ghcr.io/") ? "harbor.example.com/ghcr-proxy-cache/" + c.image.substring(8)
              : c.image.startsWith("registry.k8s.io/") ? "harbor.example.com/registry-k8s-proxy-cache/" + c.image.substring(16)
              : c.image.matches("^[^/.:]+/.+$") ? "harbor.example.com/docker-hub-proxy-cache/" + c.image
              : c.image.matches("^[^/]+$") ? "harbor.example.com/docker-hub-proxy-cache/library/" + c.image
              : c.image
          })
          + (variables.existingPullSecrets.size() == 0
              ? [JSONPatch{op: "add", path: variables.base + "/imagePullSecrets", value: variables.pullSecrets.map(s, {"name": s})}]
              : variables.pullSecrets.filter(s, !(s in variables.existingPullSecrets)).map(s,
                  JSONPatch{op: "add", path: variables.base + "/imagePullSecrets/-", value: {"name": s}}))
