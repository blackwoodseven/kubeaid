apiVersion: v1
kind: Pod
metadata:
  name: mixed-pod
  namespace: default
spec:
  initContainers:
  - name: init
    image: harbor.example.com/docker-hub-proxy-cache/library/busybox:1.36
  containers:
  - name: app
    image: harbor.example.com/ghcr-proxy-cache/stakater/reloader:v1.4.21
  - name: sidecar
    image: harbor.example.com/registry-k8s-proxy-cache/prometheus-adapter/prometheus-adapter:v0.12.0
  - name: private
    image: acrkilroy.azurecr.io/team/app:1.0
  imagePullSecrets:
  - name: acr-pull
  - name: harbor-proxy-cache
  - name: harbor-ghcr-proxy-cache
  - name: harbor-registry-k8s-proxy-cache
