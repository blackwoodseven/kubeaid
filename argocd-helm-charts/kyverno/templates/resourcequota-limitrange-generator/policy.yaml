{{- /*
  ResourceQuota "hard" for one namespace: override values win, defaults fill
  the gaps, unset keys are dropped (a null Quantity is invalid). The values
  keys are renamed to the ResourceQuota ones here. Returns JSON, which CEL
  reads as a map.
*/}}
{{- define "kubeaid.kyverno.quotaHard" -}}
{{- $q := mergeOverwrite (deepCopy .defaults) (.quota | default dict) }}
{{- $hard := dict }}
{{- with $q.pods }}{{ $_ := set $hard "pods" (toString .) }}{{ end }}
{{- with $q.jobs }}{{ $_ := set $hard "count/jobs.batch" (toString .) }}{{ end }}
{{- with $q.cpu.request }}{{ $_ := set $hard "requests.cpu" (toString .) }}{{ end }}
{{- with $q.memory.request }}{{ $_ := set $hard "requests.memory" (toString .) }}{{ end }}
{{- with $q.memory.limit }}{{ $_ := set $hard "limits.memory" (toString .) }}{{ end }}
{{- with $q.storage.persistentVolumeClaims }}{{ $_ := set $hard "persistentvolumeclaims" (toString .) }}{{ end }}
{{- with $q.storage.request }}{{ $_ := set $hard "requests.storage" (toString .) }}{{ end }}
{{- with $q.ephemeralStorage.request }}{{ $_ := set $hard "requests.ephemeral-storage" (toString .) }}{{ end }}
{{- with $q.ephemeralStorage.limit }}{{ $_ := set $hard "limits.ephemeral-storage" (toString .) }}{{ end }}
{{- toJson $hard }}
{{- end }}

{{- if .Values.resourceQuotaLimitRangeGenerator.enabled }}

{{- /* Namespaces that carry an override, per kind. Their merged spec is rendered below. */}}
{{- $quotaOverrides := list }}
{{- $limitRangeOverrides := list }}
{{- range $ns, $o := .Values.resourceQuotaLimitRangeGenerator.overrides }}
  {{- if $o.resourceQuota }}{{ $quotaOverrides = append $quotaOverrides $ns }}{{ end }}
  {{- if hasKey $o "limitRange" }}{{ $limitRangeOverrides = append $limitRangeOverrides $ns }}{{ end }}
{{- end }}

{{- if or .Values.resourceQuotaLimitRangeGenerator.defaultResourceQuotaRuleEnabled $quotaOverrides }}
---
# A ResourceQuota per namespace stops one team from using more than its fair
# share of a shared cluster. "default" quota in every namespace, or only in
# the override namespaces when the default rule is off.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: resourcequota-generator
  annotations:
    policies.kyverno.io/title: "Generate a default ResourceQuota per namespace"
    policies.kyverno.io/category: "Multi-Tenancy"
    policies.kyverno.io/subject: "Namespace,ResourceQuota"
    policies.kyverno.io/minversion: 1.19.0
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: {{ .Values.resourceQuotaLimitRangeGenerator.generateExisting }}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE"]
  {{- if or (.Values.resourceQuotaLimitRangeGenerator.excludeNamespaces).resourceQuota (not .Values.resourceQuotaLimitRangeGenerator.defaultResourceQuotaRuleEnabled) }}
  matchConditions:
    {{- if not .Values.resourceQuotaLimitRangeGenerator.defaultResourceQuotaRuleEnabled }}
    - name: override-namespaces-only
      expression: "object.metadata.name in [{{ range $idx, $ns := $quotaOverrides }}{{ if $idx }}, {{ end }}{{ $ns | squote }}{{ end }}]"
    {{- end }}
    {{- if (.Values.resourceQuotaLimitRangeGenerator.excludeNamespaces).resourceQuota }}
    - name: not-excluded
      expression: "!(object.metadata.name in [{{ range $idx, $ns := .Values.resourceQuotaLimitRangeGenerator.excludeNamespaces.resourceQuota }}{{ if $idx }}, {{ end }}{{ $ns | squote }}{{ end }}])"
    {{- end }}
  {{- end }}
  variables:
    # Override namespaces and their quota, already merged with the defaults by Helm.
    - name: overrides
      expression: >-
        {{ "{" }}{{ range $idx, $ns := $quotaOverrides }}{{ if $idx }}, {{ end }}{{ $ns | quote }}: {{ include "kubeaid.kyverno.quotaHard" (dict "quota" (index $.Values.resourceQuotaLimitRangeGenerator.overrides $ns).resourceQuota "defaults" $.Values.resourceQuotaLimitRangeGenerator.defaults.resourceQuota) }}{{ end }}{{ "}" }}
    - name: hard
      expression: >-
        object.metadata.name in variables.overrides ? variables.overrides[object.metadata.name]
        : {{ include "kubeaid.kyverno.quotaHard" (dict "quota" dict "defaults" .Values.resourceQuotaLimitRangeGenerator.defaults.resourceQuota) }}
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: ResourceQuota
          metadata:
            name: default
            namespace: (( object.metadata.name ))
          spec:
            hard: (( variables.hard ))
{{- end }}
---
# A LimitRange gives containers default requests and limits and caps single
# objects, so one Pod or PVC cannot monopolise a namespace's quota.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: limitrange-generator
  annotations:
    policies.kyverno.io/title: "Generate a default LimitRange per namespace"
    policies.kyverno.io/category: "Multi-Tenancy"
    policies.kyverno.io/subject: "Namespace,LimitRange"
    policies.kyverno.io/minversion: 1.19.0
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: {{ .Values.resourceQuotaLimitRangeGenerator.generateExisting }}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE"]
  {{- if (.Values.resourceQuotaLimitRangeGenerator.excludeNamespaces).limitRange }}
  matchConditions:
    - name: not-excluded
      expression: "!(object.metadata.name in [{{ range $idx, $ns := .Values.resourceQuotaLimitRangeGenerator.excludeNamespaces.limitRange }}{{ if $idx }}, {{ end }}{{ $ns | squote }}{{ end }}])"
  {{- end }}
  variables:
    # Override namespaces with their limit range, merged with the defaults by Helm.
    - name: overrides
      expression: >-
        {{ "{" }}{{ range $idx, $ns := $limitRangeOverrides }}{{ if $idx }}, {{ end }}{{ $ns | quote }}: {{ mergeOverwrite (deepCopy $.Values.resourceQuotaLimitRangeGenerator.defaults.limitRange) ((index $.Values.resourceQuotaLimitRangeGenerator.overrides $ns).limitRange | default dict) | toJson }}{{ end }}{{ "}" }}
    - name: lr
      expression: >-
        object.metadata.name in variables.overrides ? variables.overrides[object.metadata.name]
        : {{ .Values.resourceQuotaLimitRangeGenerator.defaults.limitRange | toJson }}
  generate:
    - template:
        interpolate: cel
        value: |
          apiVersion: v1
          kind: LimitRange
          metadata:
            name: default
            namespace: (( object.metadata.name ))
          spec:
            limits:
              - type: Container
                defaultRequest:
                  cpu: (( variables.lr.container.cpu.defaultRequest ))
                  memory: (( variables.lr.container.memory.defaultRequest ))
                default:
                  memory: (( variables.lr.container.memory.default ))
                max:
                  memory: (( variables.lr.container.memory.max ))
              - type: Pod
                max:
                  memory: (( variables.lr.pod.memory.max ))
              - type: PersistentVolumeClaim
                max:
                  storage: (( variables.lr.pvc.storage.max ))
{{- end }}
