{{- if .Values.resourceQuotaLimitRangeGenerator.enabled }}

{{/* Namespaces with a resourceQuota / limitRange override, and their merged specs */}}
{{- $rqOverrides := dict }}
{{- $lrOverrides := dict }}
{{- range $ns, $o := .Values.resourceQuotaLimitRangeGenerator.overrides }}
  {{- if $o.resourceQuota }}{{ $_ := set $rqOverrides $ns (include "kubeaid.kyverno.quotaHard" (dict "quota" $o.resourceQuota "defaults" $.Values.resourceQuotaLimitRangeGenerator.defaults.resourceQuota)) }}{{ end }}
  {{- if hasKey $o "limitRange" }}{{ $_ := set $lrOverrides $ns (include "kubeaid.kyverno.limitRangeLimits" (dict "lr" $o.limitRange "defaults" $.Values.resourceQuotaLimitRangeGenerator.defaults.limitRange)) }}{{ end }}
{{- end }}

{{- if or (ternary .Values.resourceQuotaLimitRangeGenerator.defaultResourceQuotaRuleEnabled true (hasKey .Values.resourceQuotaLimitRangeGenerator "defaultResourceQuotaRuleEnabled")) $rqOverrides }}
---
# When several teams share a cluster, a ResourceQuota per namespace stops one
# team from using more than its fair share. This generates a "default" quota in
# every namespace (or only in the override namespaces when the default rule is off).
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: resourcequota-generator
  annotations:
    policies.kyverno.io/title: "Generate a default ResourceQuota per namespace"
    policies.kyverno.io/category: "Multi-Tenancy"
    policies.kyverno.io/subject: "Namespace,ResourceQuota"
    policies.kyverno.io/minversion: 1.19.0
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: {{ ternary .Values.resourceQuotaLimitRangeGenerator.generateExisting true (hasKey .Values.resourceQuotaLimitRangeGenerator "generateExisting") }}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE"]
  {{- if or (.Values.resourceQuotaLimitRangeGenerator.excludeNamespaces).resourceQuota (not (ternary .Values.resourceQuotaLimitRangeGenerator.defaultResourceQuotaRuleEnabled true (hasKey .Values.resourceQuotaLimitRangeGenerator "defaultResourceQuotaRuleEnabled"))) }}
  matchConditions:
    {{- if not (ternary .Values.resourceQuotaLimitRangeGenerator.defaultResourceQuotaRuleEnabled true (hasKey .Values.resourceQuotaLimitRangeGenerator "defaultResourceQuotaRuleEnabled")) }}
    - name: override-namespaces-only
      expression: "object.metadata.name in [{{ range $idx, $ns := (keys $rqOverrides | sortAlpha) }}{{ if $idx }}, {{ end }}{{ $ns | squote }}{{ end }}]"
    {{- end }}
    {{- if (.Values.resourceQuotaLimitRangeGenerator.excludeNamespaces).resourceQuota }}
    - name: not-excluded
      expression: "!(object.metadata.name in [{{ range $idx, $ns := (.Values.resourceQuotaLimitRangeGenerator.excludeNamespaces).resourceQuota }}{{ if $idx }}, {{ end }}{{ $ns | squote }}{{ end }}])"
    {{- end }}
  {{- end }}
  variables:
    - name: ns
      expression: "object.metadata.name"
    # Per-namespace overrides, already merged with the defaults by Helm.
    - name: overrides
      expression: >-
        {{ "{" }}{{ range $idx, $ns := (keys $rqOverrides | sortAlpha) }}{{ if $idx }}, {{ end }}{{ $ns | quote }}: {{ index $rqOverrides $ns }}{{ end }}{{ "}" }}
    - name: hard
      expression: >-
        variables.ns in variables.overrides ? variables.overrides[variables.ns]
        : {{ include "kubeaid.kyverno.quotaHard" (dict "quota" dict "defaults" .Values.resourceQuotaLimitRangeGenerator.defaults.resourceQuota) }}
    - name: downstream
      expression: >-
        [{
          "apiVersion": dyn("v1"),
          "kind": dyn("ResourceQuota"),
          "metadata": dyn({"name": "default", "namespace": string(variables.ns)}),
          "spec": dyn({"hard": variables.hard})
        }]
  generate:
    - expression: generator.Apply(variables.ns, variables.downstream)
{{- end }}
---
# A LimitRange gives containers default requests/limits and caps single objects,
# so one Pod or PVC cannot monopolise a namespace's quota.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: limitrange-generator
  annotations:
    policies.kyverno.io/title: "Generate a default LimitRange per namespace"
    policies.kyverno.io/category: "Multi-Tenancy"
    policies.kyverno.io/subject: "Namespace,LimitRange"
    policies.kyverno.io/minversion: 1.19.0
spec:
  evaluation:
    synchronize:
      enabled: true
    generateExisting:
      enabled: {{ ternary .Values.resourceQuotaLimitRangeGenerator.generateExisting true (hasKey .Values.resourceQuotaLimitRangeGenerator "generateExisting") }}
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["namespaces"]
        operations: ["CREATE"]
  {{- if (.Values.resourceQuotaLimitRangeGenerator.excludeNamespaces).limitRange }}
  matchConditions:
    - name: not-excluded
      expression: "!(object.metadata.name in [{{ range $idx, $ns := (.Values.resourceQuotaLimitRangeGenerator.excludeNamespaces).limitRange }}{{ if $idx }}, {{ end }}{{ $ns | squote }}{{ end }}])"
  {{- end }}
  variables:
    - name: ns
      expression: "object.metadata.name"
    - name: overrides
      expression: >-
        {{ "{" }}{{ range $idx, $ns := (keys $lrOverrides | sortAlpha) }}{{ if $idx }}, {{ end }}{{ $ns | quote }}: {{ index $lrOverrides $ns }}{{ end }}{{ "}" }}
    - name: limits
      expression: >-
        variables.ns in variables.overrides ? variables.overrides[variables.ns]
        : {{ include "kubeaid.kyverno.limitRangeLimits" (dict "lr" dict "defaults" .Values.resourceQuotaLimitRangeGenerator.defaults.limitRange) }}
    - name: downstream
      expression: >-
        [{
          "apiVersion": dyn("v1"),
          "kind": dyn("LimitRange"),
          "metadata": dyn({"name": "default", "namespace": string(variables.ns)}),
          "spec": dyn({"limits": variables.limits})
        }]
  generate:
    - expression: generator.Apply(variables.ns, variables.downstream)
{{- end }}
