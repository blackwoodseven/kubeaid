{{- /* Runs as a postStart hook, see README - the plugin dir and console live on the RWO volume a separate job cannot mount */}}
{{- $o := .Values.matomo.oidc | default dict }}
{{- if $o.enabled }}
{{- $kc := printf "%s/realms/%s/protocol/openid-connect" (required "set matomo.oidc.keycloakUrl" $o.keycloakUrl) (required "set matomo.oidc.realm" $o.realm) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: matomo-oidc-setup
data:
  setup.sh: |
    #!/bin/bash
    set -euo pipefail
    M=/bitnami/matomo
    until [ -f "$M/config/config.ini.php" ]; do sleep 2; done
    if [ ! -d "$M/plugins/LoginOIDC" ]; then
      curl -fsSL "https://plugins.matomo.org/api/2.0/plugins/LoginOIDC/download/latest" -o /tmp/loginoidc.zip
      php -r '$z = new ZipArchive; if ($z->open("/tmp/loginoidc.zip") !== true || !$z->extractTo("/bitnami/matomo/plugins/")) { exit(1); }'
      rm -f /tmp/loginoidc.zip
    fi
    php "$M/console" plugin:activate LoginOIDC || true
    php "$M/console" config:set \
      'LoginOIDC.authenticationName="{{ $o.buttonName | default "Login with Keycloak" }}"' \
      'LoginOIDC.authorizeUrl="{{ $kc }}/auth"' \
      'LoginOIDC.tokenUrl="{{ $kc }}/token"' \
      'LoginOIDC.userinfoUrl="{{ $kc }}/userinfo"' \
      'LoginOIDC.endSessionUrl="{{ $kc }}/logout"' \
      'LoginOIDC.userinfoId="{{ $o.userinfoId | default "email" }}"' \
      'LoginOIDC.clientId="{{ $o.clientId | default "matomo" }}"' \
      "LoginOIDC.clientSecret=\"${MATOMO_OIDC_CLIENT_SECRET}\"" \
      'LoginOIDC.scope="{{ $o.scope | default "openid email" }}"' \
      'LoginOIDC.allowSignup={{ if hasKey $o "allowSignup" }}{{ ternary 1 0 $o.allowSignup }}{{ else }}1{{ end }}' \
      'LoginOIDC.allowedSignupDomains="{{ $o.allowedSignupDomains | default "" }}"'
{{- end }}
