{{- if .Values.mattermost.enabled }}
apiVersion: installation.mattermost.com/v1beta1
kind: Mattermost
metadata:
  name: {{ .Values.mattermost.name | default "mattermost" }}
spec:
  image: {{ .Values.mattermost.image | default "mattermost/mattermost-enterprise-edition" }}
  imagePullPolicy: {{ .Values.mattermost.imagePullPolicy | default "IfNotPresent" }}
  version: {{ .Values.mattermost.version | default "10.9.4" }}
  {{- with .Values.mattermost.size }}
  size: {{ . }}
  {{- end }}
  {{- with .Values.mattermost.replicas }}
  replicas: {{ . }}
  {{- end }}
  {{- with .Values.mattermost.podTemplate }}
  podTemplate:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.mattermost.extraPorts }}
  podExtensions:
    containerPorts:
      {{- range . }}
      - name: {{ .name }}
        containerPort: {{ .containerPort }}
        protocol: {{ .protocol | default "TCP" }}
      {{- end }}
  {{- end }}
  {{- with .Values.mattermost.resources }}
  scheduling:
    resources:
      {{- toYaml . | nindent 6 }}
  {{- end }}
  {{- if .Values.mattermost.useServiceLoadBalancer }}
  useServiceLoadBalancer: true
  {{- end }}
  {{- with .Values.mattermost.serviceAnnotations }}
  serviceAnnotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ingress:
    enabled: {{ .Values.mattermost.ingress.enabled | default true }}
    {{- if .Values.mattermost.ingress.host }}
    host: {{ .Values.mattermost.ingress.host }}
    {{- end }}
    {{- if .Values.mattermost.ingress.tlsSecret }}
    tlsSecret: {{ .Values.mattermost.ingress.tlsSecret }}
    {{- end }}
    {{- if .Values.mattermost.ingress.annotations }}
    annotations:
{{ toYaml .Values.mattermost.ingress.annotations | indent 6 }}
    {{- end }}
  {{- if .Values.mattermost.mattermostEnv }}
  mattermostEnv:
{{ toYaml .Values.mattermost.mattermostEnv | indent 4 }}
  {{- end }}
  {{- if .Values.mattermost.licenseSecret }}
  licenseSecret: {{ .Values.mattermost.licenseSecret | quote }}
  {{- end }}
  database:
    external:
      secret: {{ .Values.mattermost.database.external.secret | default "db-credentials" }}
  fileStore:
  {{- if .Values.mattermost.fileStore.external.enabled }}
    external:
      url: {{ .Values.mattermost.fileStore.external.url | default "s3.obmondo.com" }}
      bucket: {{ .Values.mattermost.fileStore.external.bucket | default "kbm-postgres-backups" }}
      secret: {{ .Values.mattermost.fileStore.external.secret | default "mattermost-pgsql-filestore-creds" }}
  {{- else if .Values.mattermost.fileStore.volume.storageClass }}
    externalVolume:
      volumeClaimName: {{ .Values.mattermost.name | default "mattermost" }}-files
  {{- else }}
    local:
      enabled: {{ .Values.mattermost.fileStore.local.enabled | default true }}
      storageSize: {{ .Values.mattermost.fileStore.local.storageSize | default "10Gi" }}
  {{- end }}
{{- end }}