# Present so `helm lint` can render mattermost-installation.yaml, whose fields all
# carry their own defaults. Real values come from the per-cluster values file.
mattermost:
  # false installs only the operator, without a Mattermost instance.
  enabled: true
  ingress: {}
  database:
    external: {}
  fileStore:
    external: {}
    local: {}
    # storageClass (and size, default 10Gi) puts the files on a ReadWriteOnce PVC the chart
    # creates on that class. Run one replica with it.
    volume: {}
  # goes into the CR's spec.podTemplate
  podTemplate: {}

global:
  netpol:
    enabled: false
  mattermost-operator:
    netpol: false

  postgresql:
    enabled: true
    instanceName: mattermost-operator
    instances: 1
    monitoring:
      enablePodMonitor: true
    size: 8Gi
    recover:
      enabled: false
    backups:
      enabled: false
      schedule: "0 2 * * *"
      retentionPolicy: 30d
      provider: aws
      aws:
        enableKube2IAMIntegration: true
    logicalbackup:
      enabled: false
      schedule: "0 2 * * *"
      provider: s3
      retention: "30d"
    resources:
      limits:
        memory: 800Mi
        cpu: 250m
      requests:
        memory: 500Mi
        cpu: 250m
