rustfs:
  image:
    rustfs:
      tag: 1.0.0
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 8Gi
  replicaCount: 4
  mode:
    standalone:
      enabled: false
    distributed:
      enabled: true
  config:
    rustfs:
      log_level: warn
      region: us-east-1
      log_rotation:
        size: 100 # unit is MB
        time: day
        keep_files: 30 # Our compliance suggests 30d retention for daily backups
  storageclass:
    name: local-path
    dataStorageSize: 256Mi
    logStorageSize: 256Mi
  ingress:
    enabled: true
    className: nginx

backupCleanup:
  enabled: false
  # Not 03:00: the velero chart's daily schedule defaults to that same hour, and
  # rustfs sheds writes when the cleanup walk and a backup upload overlap.
  schedule: "0 5 * * *"
  retentionDays: 7
  buckets: []
  excludePrefixes: []
  # Prefixes where only the latest version of each object is kept and older ones are
  # deleted. Live objects always survive, so unlike excludePrefixes this is safe for a
  # prefix whose contents must be kept - a Velero/kopia repository, where kopia deletes
  # superseded blobs but a versioned bucket retains them for ever.
  keepOnlyLatestVersion: []
  # Defaults to retentionDays when unset.
  keepOnlyLatestRetentionDays: ""
  keepOnlyLatestBatchSize: ""
  region: us-east-1
  # endpoint: S3-compatible endpoint. Defaults to http://<release-name>-svc.<namespace>.svc.cluster.local:9000
  # secretName: secret providing the credentials. Defaults to rustfs.secret.existingSecret.
  secretAccessKeyIdKey: RUSTFS_ACCESS_KEY
  secretSecretAccessKeyKey: RUSTFS_SECRET_KEY
  image:
    repository: ghcr.io/obmondo/s3-backup-cleanup
    tag: v1.1.0
