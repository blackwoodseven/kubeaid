rustfs:
  image:
    rustfs:
      # beta.12 serialises concurrent UploadPart on one upload-ID-scoped lock
      # and 503s after the 5s lock timeout, breaking every Velero backup.
      # Fixed by rustfs#5990 in rc.2; rc.5 also carries the follow-up fixes.
      tag: 1.0.0-rc.5
  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      memory: 8Gi
  replicaCount: 4
  mode:
    standalone:
      enabled: false
    distributed:
      enabled: true
  config:
    rustfs:
      log_level: warn
      region: us-east-1
      log_rotation:
        size: 100 # unit is MB
        time: day
        keep_files: 30 # Our compliance suggests 30d retention for daily backups
  storageclass:
    name: local-path
    dataStorageSize: 256Mi
    logStorageSize: 256Mi
  ingress:
    enabled: true
    className: nginx

backupCleanup:
  enabled: false
  # Not 03:00: the velero chart's daily schedule defaults to that same hour, and
  # rustfs sheds writes when the cleanup walk and a backup upload overlap.
  schedule: "0 5 * * *"
  retentionDays: 7
  buckets: []
  excludePrefixes: []
  region: us-east-1
  # endpoint: S3-compatible endpoint. Defaults to http://<release-name>-svc.<namespace>.svc.cluster.local:9000
  # secretName: secret providing the credentials. Defaults to rustfs.secret.existingSecret.
  secretAccessKeyIdKey: RUSTFS_ACCESS_KEY
  secretSecretAccessKeyKey: RUSTFS_SECRET_KEY
  image:
    repository: ghcr.io/obmondo/s3-backup-cleanup
    tag: v1.0.3
