apiVersion: v2
name: ciso-assistant
version: 1.0.0
# charts/ciso-assistant-next is a hand-vendored copy of upstream 0.4.1
# (https://intuitem.github.io/ca-helm-chart/); fetching it as a dependency was
# failing. It is declared below with an empty repository, which is how Helm is
# told a subchart already lives in charts/: `helm dependency update` then leaves
# it alone instead of refetching. Leaving it undeclared makes `helm lint` fail
# on missing dependency metadata. The name is the subchart's own (ciso-assistant),
# which differs from its directory name.
dependencies:
  - name: ciso-assistant
    version: 0.4.1
    repository: ""
  - name: kubeaid-addons
    version: 1.1.0
    repository: file://../kubeaid-addons
