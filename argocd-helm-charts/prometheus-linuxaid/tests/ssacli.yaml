---
evaluation_interval: 1m

rule_files:
  - ../rules/ssacli.yaml

tests:
  - interval: 1m
    input_series:
      - series: obmondo_monitoring{certname="jacen.example", alert_id="monitor::system::service::ssacli::disk_healthy"}
        values: 1x1000
      - series: hp_smart_array_disk_status{certname="jacen.example", bay="1"}
        values: 0x1000

    alert_rule_test:
      - alertname: 'monitor::system::service::ssacli::disk_healthy'
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: 'critical'
              certname: 'jacen.example'
              bay: 1
              alert_id: 'monitor::system::service::ssacli::disk_healthy'
            exp_annotations:
              summary: 'Disk status for bay **1** on **jacen.example** has failed'
              description: 'Disk status for bay **1** on **jacen.example** has failed'
