{{- /* One per distinct ServiceAccount name -- see kubeaid-addons.mongodb.serviceAccountNames. */ -}}
{{- range (include "kubeaid-addons.mongodb.serviceAccountNames" . | fromJsonArray) }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ . }}
roleRef:
  kind: Role
  name: {{ . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
