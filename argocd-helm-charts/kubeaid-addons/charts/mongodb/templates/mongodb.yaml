{{- range (include "kubeaid-addons.mongodb.instances" . | fromJsonArray) }}
---
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: {{ .instanceName }}
  namespace: {{ $.Release.Namespace }}
spec:
  members: {{ .replicas | default 2 }}
  type: ReplicaSet
  version: {{ .version | default "7.0.28" | quote }}
  security:
    authentication:
      modes: ["SCRAM"]
    {{- if (.tls).enabled }}
    tls:
      enabled: true
      {{- if .tls.optional }}
      optional: true
      {{- end }}
      certificateKeySecretRef:
        name: {{ .tls.certSecretName | default (printf "%s-tls" .instanceName) }}
      caCertificateSecretRef:
        name: {{ .tls.caSecretName | default (printf "%s-ca" .instanceName) }}
    {{- end }}
  statefulSet:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mongodb
            app.kubernetes.io/instance: {{ .instanceName }}
            app.kubernetes.io/component: database
            {{- range $key, $val := .podLabels }}
            {{ $key }}: {{ $val }}
            {{- end }}
        spec:
          {{- /* The operator forces mongodb-kubernetes-appdb anyway; set only to add RBAC for another name. */}}
          {{- with .serviceAccountName }}
          serviceAccountName: {{ . }}
          {{- end }}
          {{- if .resources }}
          containers:
            - name: mongod
              resources:
                {{- toYaml .resources | nindent 16 }}
          {{- end }}
      volumeClaimTemplates:
        - metadata:
            name: data-volume
            labels:
              velero.io/exclude-from-backup: "true"
          spec:
            accessModes:
              - ReadWriteOnce
            {{- if .dataVolume.storageClass }}
            storageClassName: {{ .dataVolume.storageClass }}
            {{- end }}
            resources:
              requests:
                storage: {{ .dataVolume.size }}
        {{- if .logsVolume }}
        - metadata:
            name: logs-volume
            labels:
              velero.io/exclude-from-backup: "true"
          spec:
            accessModes:
              - ReadWriteOnce
            {{- if .logsVolume.storageClass }}
            storageClassName: {{ .logsVolume.storageClass }}
            {{- end }}
            resources:
              requests:
                storage: {{ .logsVolume.size }}
        {{- end }}
  {{- if .users }}
  users:
    {{- range .users }}
    - db: {{ .db }}
      name: {{ .name }}
      passwordSecretRef:
        name: {{ .passwordSecretRef.name }}
        key: {{ .passwordSecretRef.key | default "password" }}
      roles:
        {{- range .roles }}
        - db: {{ .db }}
          name: {{ .name }}
        {{- end }}
      scramCredentialsSecretName: {{ .scramCredentialsSecretName }}
    {{- end }}
  {{- end }}
  {{- with (.agent).logLevel }}
  agent:
    logLevel: {{ . }}
  {{- end }}
{{- end }}
