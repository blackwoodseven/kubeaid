{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "linuxaid-security-exporter.fullname" . }}
  labels:
    {{- include "linuxaid-security-exporter.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "linuxaid-security-exporter.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      relabelings:
        # key the metrics by node rather than pod, as smartmon-exporter does
        - action: replace
          sourceLabels:
            - __meta_kubernetes_pod_node_name
          targetLabel: instance
{{- end }}
