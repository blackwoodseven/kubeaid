apiVersion: v2
name: linuxaid-security-exporter
description: >-
  Report every node's installed packages to a Vuls server for CVE scanning and
  expose the findings as Prometheus metrics: a DaemonSet that reads each node's
  package database read-only and authenticates with the cluster's Obmondo
  client certificate.
icon: https://avatars.githubusercontent.com/u/13882947?s=250&v=4
type: application
version: 0.1.0
appVersion: v2.5.0
keywords:
  - obmondo
  - kubeaid
  - linuxaid
  - security
  - vuls
  - cve
