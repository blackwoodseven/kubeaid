nameOverride: ""
fullnameOverride: ""

# -- KubeAid Agent config file contents.
appConfig:
  argocd:
    # -- Name of the Kubernetes Secret (in argocd namespace) containing the ArgoCD auth token
    # under the "token" key.
    authTokenSecretName: argocd-project-role-kubeaid-agent

    plainText: false

  server:
    port: 4000

  obmondoAPI:
    url: https://api.obmondo.com/api
    tls:
      keyFile: /etc/kubeaid-agent/obmondo-api/tls.key
      certFile: /etc/kubeaid-agent/obmondo-api/tls.crt
      caCertFile: /etc/kubeaid-agent/obmondo-api/ca.crt

  puppetConfigDetails:
    url:
    facts:
      - os
      - networking
      - ipaddress
      - hostname
      - domain
      - virtual
      - obmondo_customer
      - obmondo_system
      - snapshot
    runKubeAidPuppetSync: false

  kubeaidUpdate:
    # -- When true, the agent schedules the service-window ArgoCD sync cron job.
    # Default is false (opt-in per cluster). Other features (node count, kube
    # version, etc.) are unaffected.
    enabled: false

    # -- Cadence at which the agent polls Obmondo API for an active KubeAid update
    # service window. Short enough to react inside a window's granularity, long
    # enough not to thrash the API when no window is open.
    checkInterval: 15m

  # Security posture: vulnerabilities with full CVE detail, least-privilege
  # findings, per-app network enforcement and runtime detection posture,
  # submitted to the Obmondo API for display in the UI.
  securityPosture:
    # -- When false, neither CRON job is scheduled, no snapshot is sent to
    # Obmondo API, and the corresponding RBAC rules are not created. This is
    # the switch for clusters that must not ship vulnerability detail off-site.
    #
    # Safe to leave on where no scanner is installed: the collector detects
    # that through API discovery and does nothing, rather than erroring.
    enabled: true

    # -- Cadence of the full posture collection. Trivy refreshes its reports on
    # a 24h scannerReportTTL, so polling faster re-reads identical data.
    interval: 12h

    # -- Cadence at which the agent checks for a service-window edge, to capture
    # a before/after pair around maintenance. This bounds how precisely an edge
    # is timed; a window opening and closing entirely between two checks is
    # missed. Each check is one Obmondo API call, not a cluster scan.
    windowCheckInterval: 15m

# -- Kubernetes Secret name containing the TLS certificate key-pair, used to communicate with
# Obmondo API.
obmondoAPITLSSecretName: obmondo-clientcert

# -- Extra namespaces where the agent's ServiceAccount may read secrets.
# A Role + RoleBinding (get/list/watch on secrets) is created in each.
# The target namespaces must already exist. Useful for cross-namespace
# secret reads (e.g. obmondo-websites).
extraSecretReaderNamespaces: []
#  - obmondo-websites

configMap:
  labels: {}
  annotations: {}

deployment:
  replicas: 1

  podLabels: {}
  podAnnotations: {}

  imagePullSecrets: []

  podSecurityContext:
    runAsNonRoot: true
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  image:
    repository: ghcr.io/obmondo/kubeaid-agent
    tag: v0.7.0
    pullPolicy: Always

  env: []

  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    capabilities:
      drop: ["ALL"]

  probes:
    readiness:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
      successThreshold: 1
    liveness:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 2
      successThreshold: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

  extraVolumes: []

  terminationGracePeriodSeconds: 10

  nodeSelector: {}
  affinity: {}
  tolerations: []

service:
  labels: {}
  annotations: {}

  port: 80

serviceMonitor:
  enabled: true

  labels: {}
  annotations: {}

  interval: 30s
  scrapeTimeout: 10s

# Alerts on the agent's own security-posture metrics. Only rendered when
# appConfig.securityPosture.enabled is true, since without collection the
# metrics never appear and every rule would evaluate against nothing.
prometheusRule:
  enabled: true

  # -- Extra labels on the PrometheusRule object, for Prometheus selector
  # matching.
  additionalLabels: {}
  additionalAnnotations: {}

  # -- Alert when more than this many images have BOTH a fixable Critical/High
  # finding and a newer tag available upstream. Zero means alert on any such
  # image. One alert per cluster, not one per image.
  upgradableThreshold: 0

  # -- How long the count must stay above the threshold. Long by design: this
  # is a backlog to work through, not an incident.
  upgradableFor: 24h

