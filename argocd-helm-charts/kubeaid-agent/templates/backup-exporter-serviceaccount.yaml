{{- if .Values.backupExporter.enabled }}
{{- if .Values.backupExporter.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeaid-agent.backupExporter.serviceAccountName" . }}
  labels:
    {{- include "kubeaid-agent.backupExporter.labels" . | nindent 4 }}
  {{- with .Values.backupExporter.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.backupExporter.serviceAccount.automount }}
{{- end }}
{{- end }}
