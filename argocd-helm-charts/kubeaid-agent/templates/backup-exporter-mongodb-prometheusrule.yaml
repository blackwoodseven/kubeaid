{{- if .Values.backupExporter.enabled }}
{{- if and .Values.backupExporter.prometheusRule.enabled (hasKey .Values.backupExporter.prometheusRule "mongodb") ( .Values.backupExporter.prometheusRule.mongodb.enabled ) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubeaid-agent.backupExporter.fullname" . }}-mongodb
  namespace: {{ .Values.backupExporter.prometheusRule.mongodb.namespace | default "monitoring" }}
  labels:
    {{- include "kubeaid-agent.backupExporter.labels" . | nindent 4 }}
    {{- if .Values.backupExporter.prometheusRule.mongodb.labels }}
    {{- toYaml .Values.backupExporter.prometheusRule.mongodb.labels | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "kubeaid-agent.backupExporter.name" . }}-mongodb
      rules:
        - alert: MongoDBBackupExporterJobFailed
          expr: max by (namespace, cluster_name, backup, type) (backup_exporter_mongodb_error == 1) > 0
          for: {{ .Values.backupExporter.prometheusRule.mongodb.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.mongodb.severity | default "critical" }}
          annotations:
            summary: 'MongoDB backup exporter job failed'
            description: 'MongoDB dump check failed for {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.cluster_name }}` }} (type: {{ `{{ $labels.type }}` }})'
        - alert: MongoDBDumpBackupExceededRPO
          expr: mongodb_latest_dump_backup_age > {{ include "kubeaid-agent.backupExporter.durationToSeconds" .Values.backupExporter.exporter.mongodb.max_rpo }}
          for: {{ .Values.backupExporter.prometheusRule.mongodb.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.mongodb.severity | default "critical" }}
          annotations:
            summary: 'MongoDB dump backup exceeded RPO'
            description: 'Dump for {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.cluster_name }}` }} exceeded RPO (age: {{ `{{ $value }}` }})'
        # Age 0 is the exporter's "no backup" sentinel, not a fresh backup: a
        # dump taken this second still reports a positive age.
        - alert: MongoDBDumpBackupMissing
          expr: mongodb_latest_dump_backup_age == 0
          for: {{ .Values.backupExporter.prometheusRule.mongodb.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.mongodb.severity | default "critical" }}
          annotations:
            summary: 'MongoDB dump backup missing'
            description: 'No dump found for {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.cluster_name }}` }}'
{{- end }}
{{- end }}
