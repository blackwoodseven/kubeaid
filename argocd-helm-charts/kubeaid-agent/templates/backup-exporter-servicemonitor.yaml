{{- if .Values.backupExporter.enabled }}
{{- if .Values.backupExporter.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kubeaid-agent.backupExporter.fullname" . }}
  labels:
    {{- include "kubeaid-agent.backupExporter.labels" . | nindent 4 }}
    {{- with .Values.backupExporter.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  endpoints:
    - interval: {{ .Values.backupExporter.serviceMonitor.interval }}
      port: http
      path: /metrics
      # The exporter's own "namespace" label (the app/PVC being reported on)
      # otherwise collides with the one Prometheus injects from the scrape
      # target (this pod's own namespace) and gets renamed to
      # "exported_namespace". honorLabels keeps the scraped value instead, so
      # every PrometheusRule can just match on "namespace" directly.
      honorLabels: true
  selector:
    matchLabels:
      {{- include "kubeaid-agent.backupExporter.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
{{- end }}
