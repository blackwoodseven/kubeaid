{{- if .Values.securityExporter.enabled }}
{{- if .Values.securityExporter.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kubeaid-agent.securityExporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeaid-agent.securityExporter.labels" . | nindent 4 }}
    {{- with .Values.securityExporter.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.securityExporter.serviceMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kubeaid-agent.securityExporter.selectorLabels" . | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.securityExporter.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.securityExporter.serviceMonitor.scrapeTimeout }}
{{- end }}
{{- end }}
