{{- if .Values.backupExporter.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeaid-agent.backupExporter.fullname" . }}
  labels:
    {{- include "kubeaid-agent.backupExporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeaid-agent.backupExporter.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeaid-agent.backupExporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}   # ← Critical: must match deployment namespace
{{- end }}
