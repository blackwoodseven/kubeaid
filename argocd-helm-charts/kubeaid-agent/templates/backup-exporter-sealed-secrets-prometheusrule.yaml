{{- if .Values.backupExporter.enabled }}
{{- if and .Values.backupExporter.prometheusRule.enabled (hasKey .Values.backupExporter.prometheusRule "sealedSecrets") ( .Values.backupExporter.prometheusRule.sealedSecrets.enabled ) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubeaid-agent.backupExporter.fullname" . }}-sealed-secrets
  namespace: {{ .Values.backupExporter.prometheusRule.sealedSecrets.namespace | default "monitoring" }}
  labels:
    {{- include "kubeaid-agent.backupExporter.labels" . | nindent 4 }}
    {{- if .Values.backupExporter.prometheusRule.sealedSecrets.labels }}
    {{- toYaml .Values.backupExporter.prometheusRule.sealedSecrets.labels | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "kubeaid-agent.backupExporter.name" . }}-sealed-secrets
      rules:
        - alert: SealedSecretsBackupExporterJobFailed
          expr: max by (namespace, type) (backup_exporter_sealedsecrets_error == 1) > 0
          for: {{ .Values.backupExporter.prometheusRule.sealedSecrets.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.sealedSecrets.severity | default "critical" }}
          annotations:
            summary: 'Sealed-secrets key backup check failed'
            description: 'Key backup check failed in {{ `{{ $labels.namespace }}` }} (type: {{ `{{ $labels.type }}` }})'
        - alert: SealedSecretsKeyBackupExceededRPO
          expr: sealed_secrets_latest_key_backup_age > {{ include "kubeaid-agent.backupExporter.durationToSeconds" .Values.backupExporter.exporter.sealedSecrets.max_rpo }}
          for: {{ .Values.backupExporter.prometheusRule.sealedSecrets.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.sealedSecrets.severity | default "critical" }}
          annotations:
            summary: 'Sealed-secrets key backup exceeded RPO'
            description: 'Newest key archive in {{ `{{ $labels.namespace }}` }} is {{ `{{ $value }}` }}s old. These keys decrypt every SealedSecret in git and this backup is their only copy outside the cluster.'
        # Age 0 is the exporter's "no backup" sentinel, not a fresh backup: an
        # archive written this second still reports a positive age. Reaching
        # here means the backup job is running but its bucket is empty.
        - alert: SealedSecretsKeyBackupMissing
          expr: sealed_secrets_latest_key_backup_age == 0
          for: {{ .Values.backupExporter.prometheusRule.sealedSecrets.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.sealedSecrets.severity | default "critical" }}
          annotations:
            summary: 'Sealed-secrets key backup missing'
            description: 'No key archive exists for the sealed-secrets controller in {{ `{{ $labels.namespace }}` }} -- either its bucket is empty or no backup job is configured. Losing this cluster would make every SealedSecret in git unrecoverable.'
{{- end }}
{{- end }}
