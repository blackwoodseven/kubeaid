{{- if .Values.backupExporter.enabled }}
{{- if and .Values.backupExporter.prometheusRule.enabled (hasKey .Values.backupExporter.prometheusRule "postgres") ( .Values.backupExporter.prometheusRule.postgres.enabled ) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kubeaid-agent.backupExporter.fullname" . }}-postgres
  namespace: {{ .Values.backupExporter.prometheusRule.postgres.namespace | default "monitoring" }}
  labels:
    {{- include "kubeaid-agent.backupExporter.labels" . | nindent 4 }}
    {{- if .Values.backupExporter.prometheusRule.postgres.labels }}
    {{- toYaml .Values.backupExporter.prometheusRule.postgres.labels | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "kubeaid-agent.backupExporter.name" . }}-postgres
      rules:
        - alert: PostgresBackupExporterJobFailed
          expr: max by (namespace, cluster_name, backup, type) (backup_exporter_postgres_error{type!~"backup_not_enabled|cronjob_not_found|no_scheduled_backups"} == 1) > 0
          for: {{ .Values.backupExporter.prometheusRule.postgres.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.postgres.severity | default "critical" }}
          annotations:
            summary: 'Postgres backup exporter error'
            description: 'Postgres backup exporter error for {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.cluster_name }}` }} (backup: {{ `{{ $labels.backup }}` }}, error: {{ `{{ $labels.type }}` }})'
        - alert: PostgresLogicalBackupExceededRPO
          expr: postgres_latest_logical_backup_age > {{ include "kubeaid-agent.backupExporter.durationToSeconds" .Values.backupExporter.exporter.postgres.max_rpo }}
          for: {{ .Values.backupExporter.prometheusRule.postgres.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.postgres.severity | default "critical" }}
          annotations:
            summary: 'PostgreSQL logical backup exceeded RPO'
            description: 'Logical backup for {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.cluster_name }}` }} exceeded RPO (age: {{ `{{ $value }}` }})'
        - alert: PostgresCNPGWALBackupExceededRPO
          expr: postgres_latest_cnpg_wal_backup_age > {{ include "kubeaid-agent.backupExporter.durationToSeconds" .Values.backupExporter.exporter.postgres.max_rpo }}
          for: {{ .Values.backupExporter.prometheusRule.postgres.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.postgres.severity | default "critical" }}
          annotations:
            summary: 'PostgreSQL CNPG WAL backup exceeded RPO'
            description: 'WAL backup for {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.cluster_name }}` }} exceeded RPO (age: {{ `{{ $value }}` }})'
        - alert: PostgresLogicalBackupMissing
          expr: postgres_latest_logical_backup_age == 0 unless on (namespace, cluster_name) (backup_exporter_postgres_error{backup="logical", type=~"backup_not_enabled|cronjob_not_found"} == 1)
          for: {{ .Values.backupExporter.prometheusRule.postgres.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.postgres.severity | default "critical" }}
          annotations:
            summary: 'PostgreSQL logical backup missing'
            description: 'No logical backup found for {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.cluster_name }}` }}'
        - alert: PostgresWALBackupMissing
          expr: postgres_latest_cnpg_wal_backup_age == 0 unless on (namespace, cluster_name) (backup_exporter_postgres_error{backup="wal", type=~"backup_not_enabled|cronjob_not_found|no_scheduled_backups"} == 1)
          for: {{ .Values.backupExporter.prometheusRule.postgres.alertForDuration | default "5m" }}
          labels:
            severity: {{ .Values.backupExporter.prometheusRule.postgres.severity | default "critical" }}
          annotations:
            summary: 'PostgreSQL WAL backup missing'
            description: 'No WAL backup found for {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.cluster_name }}` }}'
{{- end }}
{{- end }}
