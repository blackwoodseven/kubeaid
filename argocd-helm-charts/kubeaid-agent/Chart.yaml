apiVersion: v2
name: kubeaid-agent
description: KubeAid Agent and its security-posture exporter — one Argo CD application, two Deployments.
icon: https://avatars.githubusercontent.com/u/13882947?s=250&v=4

type: application

version: 0.5.9
appVersion: "v1.1.2"

keywords:
  - obmondo
  - kubeaid
  - kubeaid-agent

maintainers:
  - name: Sanskar Bhushan
    email: sanskar@obmondo.com
    url: https://github.com/sbdtu5498
  - name: Archisman Mridha
    email: archisman@obmondo.com
    url: https://github.com/Archisman-Mridha
  - name: Basit Hasan
    email: basit@obmondo.com
    url: https://github.com/basit9958

# Both live in charts/ and are therefore resolved locally: no repository, no
# Chart.lock, no `helm dependency update`. The conditions let a cluster take the
# agent alone, or the agent plus either exporter.
dependencies:
  - name: kubeaid-security-exporter
    version: 0.3.5
    condition: kubeaid-security-exporter.enabled

  - name: linuxaid-security-exporter
    version: 0.1.0
    condition: linuxaid-security-exporter.enabled

  - name: kubeaid-backup-exporter
    version: 0.4.8
    condition: kubeaid-backup-exporter.enabled
