name: SBOM Update

on:
  schedule:
    # 07:00 UTC every Monday, after the weekly helm chart update.
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sbom-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@obmondo.com"

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v3.21.3'

      - name: Regenerate SBOM
        id: sbom
        env:
          BRANCH: automation/sbom-update
        run: |
          ./bin/generate-sbom.sh -o sbom.md

          if git diff --quiet -- sbom.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sbom.md is already up to date."
          else
            git switch -c "$BRANCH"
            git add sbom.md
            git commit -m "chore(sbom): regenerate sbom.md from current charts"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push update branch
        if: steps.sbom.outputs.changed == 'true'
        run: git push origin automation/sbom-update --force

      - name: Create or update pull request
        if: steps.sbom.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list --head automation/sbom-update --base master --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            echo "Updating existing PR #${existing_pr}"
          else
            gh pr create \
              --head automation/sbom-update \
              --base master \
              --title "chore(sbom): regenerate sbom.md" \
              --body "Automated SBOM refresh, generated by the \`SBOM Update\` workflow running \`bin/generate-sbom.sh\`."
          fi
